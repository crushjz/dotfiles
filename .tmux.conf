# Reload tmux config with `prefix r`
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Set the default terminal mode to 256color mode
set -g default-terminal "tmux-256color"

# Set delay between prefix and command
set -s escape-time 1

# Setting the prefix from C-b to C-a
set -g prefix C-a

# Free the original Ctrl-b prefix keybinding
unbind C-b

# Enable mouse
set -g mouse on

# Enable vi mode
set -g mode-keys vi

# Controls how modified keys (keys pressed together with Control, Meta, or Shift) are reported.
# Requires tmux 3.6: https://github.com/ghostty-org/ghostty/discussions/5924
set -s extended-keys on

# When enabled, focus events are requested from the terminal if supported and passed through to applications running in tmux.
set -g focus-events on

# Split panes with \ and -
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Set window indexing to start at 1 instead of 0
set -g base-index 1

# Set pane indexing to start at 1 instead of 0
setw -g pane-base-index 1

# Border lines between panes are thicker
# single -> single lines using ACS or UTF-8 characters
# double -> double lines using UTF-8 characters
# heavy  -> heavy lines using UTF-8 characters
# simple -> simple ASCII characters
# number -> the pane number
set -g pane-border-lines double

# Indicate active pane by colouring only half of the border in windows with 
# exactly two panes, by displaying arrow markers, by drawing both or neither.
# [off | colour | arrows | both]
set -g pane-border-indicators both

# Move between panes with Prefix h,j,k,l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# smart-splits.nvim integration
# Check if pane is running vim and send keys, otherwise select pane
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -n C-M-h if-shell "$is_vim" 'send-keys C-M-h' 'resize-pane -L 3'
bind-key -n C-M-j if-shell "$is_vim" 'send-keys C-M-j' 'resize-pane -D 3'
bind-key -n C-M-k if-shell "$is_vim" 'send-keys C-M-k' 'resize-pane -U 3'
bind-key -n C-M-l if-shell "$is_vim" 'send-keys C-M-l' 'resize-pane -R 3'

# Resize panes
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Display Popups
bind C-y display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "lazygit"
bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "zsh"

# Status bar
set -g status-right-length 65
set -g status-right '#{battery_icon_charge}  #{battery_percentage}#{battery_icon_status}#{battery_remain} | CPU:#{cpu_percentage} | RAM: #{ram_percentage} | %a %d/%m/%y %H:%M '
# setw -g window-status-format "#[fg=$color_gray,italics]#I: #[noitalics]#W"
# setw -g window-status-current-format "#[fg=$color_purple,italics]#I: #[fg=$color_buffer,noitalics,bold]#W"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'wfxr/tmux-fzf-url'

# tmux-battery
set -g @batt_icon_charge_tier8 ""
set -g @batt_icon_charge_tier7 ""
set -g @batt_icon_charge_tier6 ""
set -g @batt_icon_charge_tier5 ""
set -g @batt_icon_charge_tier4 ""
set -g @batt_icon_charge_tier3 ""
set -g @batt_icon_charge_tier2 ""
set -g @batt_icon_charge_tier1 ""
set -g @batt_icon_status_charged " "
set -g @batt_icon_status_charging "  "
set -g @batt_icon_status_discharging " "
set -g @batt_icon_status_attached " "
set -g @batt_icon_status_unknown " "
set -g @batt_remain_short true

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
